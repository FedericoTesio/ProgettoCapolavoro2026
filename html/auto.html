<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesio Motors | Catalogo Auto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/auto.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script src="../js/libreria.js"></script>
    <script src="../js/auto.js"></script>
    <link rel="shortcut icon" href="../img/sito/favicon.png" type="image/x-icon">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <img src="../img/sito/logo.png" alt="Tesio Motors Logo" class="navbar-logo me-2">
                <span>TESIO <span class="text-danger">MOTORS</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html"><i class="bi bi-house"></i> Home</a>
                    </li>
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-car-front"></i> Auto</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-speedometer"></i> Moto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="text-center fw-bold mb-5">Il Nostro <span class="text-danger">Catalogo</span></h2>
        <div class="container my-4">
            <div class="row g-2 shadow-sm p-3 bg-white rounded align-items-center">
                <div class="col">
                    <input type="text" id="searchBar" class="form-control" placeholder="Cerca modello o marca...">
                </div>
                <div class="col-auto">
                    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#modalFiltri">
                        <i class="bi bi-sliders"></i> Filtri Avanzati
                    </button>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalFiltri" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="modalFiltriLabel">
                            TESIO <span class="text-danger">MOTORS</span> | <span
                                class="small text-uppercase">Filtri</span>
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-4">
                            <div class="col-12">
                                <label class="fw-bold mb-2">Marche disponibili:</label>
                                <div id="brandContainer" class="d-flex flex-wrap gap-2">
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="fw-bold mb-2">Categoria:</label>
                                <div id="categoryContainer" class="d-flex flex-wrap gap-2">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Dal: <span id="yearLabel"
                                        class="text-danger">1950</span></label>
                                <input type="range" class="form-range custom-range" id="rangeYear" min="1950" max="2026"
                                    value="1950">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Budget massimo: <span id="priceLabel"
                                        class="text-danger">Illimitato</span></label>
                                <input type="range" class="form-range custom-range" id="rangePrice" min="100000"
                                    max="5000000" step="50000" value="5000000">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="btnReset" class="btn btn-outline-dark">Ripristina</button>
                        <button type="button" id="btnApplica" class="btn btn-brand" data-bs-dismiss="modal">Applica
                            Filtri</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4" id="all-cars-container">
        </div>
    </div>
</body>

</html>
